# Runs 9Drive against a managed MySQL (Aiven, PlanetScale, AWS RDS, Azure, ...)
# instead of the MySQL container defined in docker-compose.yml.
#
#   # put the URL in the .env next to this file
#   DATABASE_URL="mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb?sslaccept=accept_invalid_certs"
#
#   docker compose -f docker-compose.yml -f docker-compose.external-db.yml up -d --build
#
# The bundled `mysql` container is still created by docker-compose.yml but the
# backend no longer talks to it - stop it with `docker compose stop mysql` if you
# want the memory back. The backend still applies pending migrations on boot
# (`prisma migrate deploy`), so no manual step is needed.
services:
  backend:
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env when using an external MySQL}"
