services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Local SQLite file on a named volume, so `docker compose up` needs no Turso
      # account. For the hosted database, use docker-compose.turso.yml instead.
      DATABASE_URL: ${DATABASE_URL:-file:/data/9drive.db}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-jwt-secret-at-least-32-chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-this-encryption-key-32bytes!}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/connected-accounts/google/callback}
    volumes:
      # SQLite keeps the whole database in this file; it must survive the container.
      - sqlite_data:/data
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty: the frontend calls /api on its own origin and nginx proxies it.
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      PORT: 80
      API_UPSTREAM: http://backend:4000
      # Docker's embedded DNS - required to resolve the "backend" service name.
      RESOLVER: 127.0.0.11
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  sqlite_data:
