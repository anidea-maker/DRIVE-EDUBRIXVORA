# Render blueprint (https://render.com/docs/blueprint-spec): ONE Docker service
# that serves both the API and the SPA from the same origin, using ./Dockerfile.
#
# Why one service: with two, API_UPSTREAM + VITE_API_URL + CORS must all agree, and
# a mistake looks like "Unexpected token '<'" or a 405. Same origin removes the
# whole class of problem. (The two-service setup is still supported - see the
# commented block at the bottom - it needs ./backend + ./frontend images.)
#
# Fill in the dashboard (`sync: false`):
#   DATABASE_URL       mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb   (Aiven)
#   DATABASE_CA_CERT   contents of ca.pem (PEM, base64, or a path)
#
# JWT_ACCESS_SECRET / TOKEN_ENCRYPTION_KEY are generated once by Render. Keep
# TOKEN_ENCRYPTION_KEY stable: changing it makes stored Google/S3 credentials
# unreadable. Render injects PORT itself and the app prefers it over APP_PORT.
services:
  - type: web
    name: 9drive
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # Liveness only (no DB query) so a MySQL blip cannot restart the service.
    # Use /ready to check the database from a browser.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Required. mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb
      - key: DATABASE_URL
        sync: false
      # Required for Aiven/managed MySQL (paste ca.pem: PEM, base64, or a path).
      # Turns into sslcert=certs/db-ca.pem&sslaccept=strict at runtime.
      - key: DATABASE_CA_CERT
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Optional: defaults to this service's own origin when unset.
      - key: FRONTEND_URL
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "5368709120"
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional: lets Settings -> S3 Compatible connect this backend with one
      # click, using credentials that never reach the browser. Leave unset to keep
      # entering them by hand.
      - key: STORAGE_BACKEND
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_STORAGE_MAX_MB
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: IDRIVE_E2_KEY_ID
        sync: false
      - key: IDRIVE_E2_SECRET_KEY
        sync: false
      - key: IDRIVE_E2_BUCKET
        sync: false
      - key: IDRIVE_E2_ENDPOINT_URL
        sync: false
      - key: IDRIVE_E2_REGION
        sync: false
      # DBRIJ preset names read by backend/src/modules/s3/presets.ts. The old
      # DBBYTE_* keys here were never read by any code and have been removed.
      - key: DBRIJ_STORAGE_URL
        sync: false
      - key: DBRIJ_STORAGE_ACCESS_KEY
        sync: false
      - key: DBRIJ_STORAGE_SECRET_KEY
        sync: false
      - key: DBRIJ_STORAGE_BUCKET
        sync: false
      - key: DBRIJ_REGION
        sync: false
      - key: DBRIJ_STORAGE_MAX_GB
        sync: false
      - key: DBRIJ_DISPLAY_NAME
        sync: false
      # Generic S3-compatible credentials (also accepted by presets.ts).
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      # Optional: only when a proxy rewrites Host for signed/share URLs.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OBJECT_URL_SIGNING_SECRET
        sync: false
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "600"
      # Use database only for multi-instance deployments; requires migration
      # 20261102140000_website_api_hardening.
      - key: API_RATE_LIMIT_STORAGE
        value: "memory"
      # Comma-separated exact browser origins when a site calls the API from JS.
      # Leave empty for server-to-server bearer-key calls.
      - key: API_CORS_ORIGINS
        sync: false
      - key: REQUEST_TIMEOUT_MS
        value: "1800000"
      # Edvanta resource API + server-verified administrator roles.
      # Comma-separated emails; leave empty when roles are assigned in the DB.
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: RESOURCE_URL_TTL_SECONDS
        value: "600"
      - key: RESOURCE_BULK_MAX_FILES
        value: "25"
      - key: RESOURCE_BULK_MAX_BYTES
        value: "536870912"

