# Render blueprint (https://render.com/docs/blueprint-spec): two Docker services.
#
# The services are wired to each other automatically through `fromService`, so
# the frontend can never be pointed at its own URL by mistake:
#   frontend API_UPSTREAM  <- backend  host
#   backend  FRONTEND_URL  <- frontend host
#
# Still to fill in the dashboard (`sync: false`):
#   DATABASE_URL       mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb   (Aiven)
#   DATABASE_CA_CERT   contents of ca.pem (PEM, base64, or a path)
#
# JWT_ACCESS_SECRET / TOKEN_ENCRYPTION_KEY are generated once by Render. Keep
# TOKEN_ENCRYPTION_KEY stable: changing it makes stored Google/S3 credentials
# unreadable. Render injects PORT itself and the app prefers it over APP_PORT.
services:
  - type: web
    name: 9drive-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Liveness only (no DB query) so a MySQL blip cannot restart the service.
    # Use /ready to check the database from a browser.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Required. mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb
      - key: DATABASE_URL
        sync: false
      # Required for Aiven/managed MySQL (paste ca.pem: PEM, base64, or a path).
      # Turns into sslcert=certs/db-ca.pem&sslaccept=strict at runtime.
      - key: DATABASE_CA_CERT
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # CORS origin. A bare host is accepted and upgraded to https://.
      - key: FRONTEND_URL
        fromService:
          type: web
          name: 9drive-frontend
          property: host
      - key: MAX_UPLOAD_BYTES
        value: "5368709120"
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: 9drive-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      # The browser calls /api on the frontend origin; nginx forwards it to the
      # backend. Bare host from Render is upgraded to https:// by the entrypoint.
      - key: API_UPSTREAM
        fromService:
          type: web
          name: 9drive-backend
          property: host
