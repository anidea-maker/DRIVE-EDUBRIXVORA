name: typecheck

# Why this exists: a Prisma `groupBy` call compiled locally against a hand-written
# stub but failed on the deploy host with
#   src/app.ts(192,57): error TS2345: Argument of type '{ by: [...]; _count: {...} }'
# and the whole deploy stopped. CI is the only place that runs the *real* generated
# types, so it does that on every push. The schema is SQLite (Turso/libSQL), so the
# migrations apply to a plain file here - no secrets, no hosted database.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend typecheck (real Prisma client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # `prisma.config.ts` imports the compiled URL helper from dist/, so build first.
      # Nothing reaches the network: the client uses the WASM query compiler.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/ci.db
          JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
          TOKEN_ENCRYPTION_KEY: ci-only-key-at-least-32-characters-long
      - name: Generate the Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/ci.db
      - name: Typecheck against the generated client
        run: npx tsc --noEmit
        env:
          DATABASE_URL: file:./prisma/ci.db
          JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
          TOKEN_ENCRYPTION_KEY: ci-only-key-at-least-32-characters-long
      # The real proof: apply the SQLite migrations and run the mocked/e2e suites.
      - name: Apply migrations to a throwaway SQLite database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./prisma/ci.db
      - name: Backend tests
        run: node --test test/*.test.mjs
        env:
          DATABASE_URL: file:./prisma/ci.db
          JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
          TOKEN_ENCRYPTION_KEY: ci-only-key-at-least-32-characters-long

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
